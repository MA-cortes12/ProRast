<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello word</title>
  <!-- Estilos del Mapa -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
      background-color: #f4f4f9;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #mapa {
      height: 350px;
      width: 100%;
      margin-top: 15px;
      border-radius: 5px;
    }
    #info {
      margin-top: 10px;
      font-size: 14px;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Visor de Ubicación GPS</h2>
    <p>Haz clic en el botón para mostrar tu posición actual en el mapa.</p>
    <button onclick="iniciarRastreo()">Ver mi Ubicación</button>

    <div id="info">Estado: Esperando acción del usuario...</div>
    <div id="mapa"></div>
  </div>

  <!-- Librería Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let mapa = null;
    let marcador = null;

    function iniciarRastreo() {
      const info = document.getElementById('info');

      if (!navigator.geolocation) {
        info.textContent = 'Error: Tu navegador no soporta geolocalización.';
        return;
      }

      info.textContent = 'Solicitando permiso de ubicación...';

      // watchPosition rastrea el movimiento en tiempo real
      navigator.geolocation.watchPosition(
        (posicion) => {
          const lat = posicion.coords.latitude;
          const lon = posicion.coords.longitude;
          const precision = posicion.coords.accuracy;

          info.textContent = `Latitud: ${lat.toFixed(5)} | Longitud: ${lon.toFixed(5)} (Precisión: ~${Math.round(precision)}m)`;

          // Inicializar o actualizar el mapa
          if (!mapa) {
            mapa = L.map('mapa').setView([lat, lon], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '© OpenStreetMap'
            }).addTo(mapa);

            marcador = L.marker([lat, lon]).addTo(mapa)
              .bindPopup('Tu ubicación actual')
              .openPopup();
          } else {
            marcador.setLatLng([lat, lon]);
            mapa.setView([lat, lon]);
          }
        },
        (error) => {
          switch (error.code) {
            case error.PERMISSION_DENIED:
              info.textContent = 'Permiso denegado por el usuario.';
              break;
            case error.POSITION_UNAVAILABLE:
              info.textContent = 'Información de ubicación no disponible.';
              break;
            case error.TIMEOUT:
              info.textContent = 'La solicitud expiró.';
              break;
            default:
              info.textContent = 'Ocurrió un error desconocido.';
          }
        },
        {
          enableHighAccuracy: true, // Solicita GPS de alta precisión en móviles
          timeout: 10000,
          maximumAge: 0
        }
      );
    }
  </script>
</body>
</html>
